name = "falow"
main = "worker.ts"
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat"]
# O esbuild do wrangler injeta __name() nas funções; o script inline do
# next-themes (tema claro/escuro) é gerado por toString() de uma função e
# quebrava no navegador com "__name is not defined". Recomendação do OpenNext:
# https://opennext.js.org/cloudflare/howtos/keep_names
keep_names = false
# O Worker so atende em falow.app.br/sistema: nada de endereco *.workers.dev
# publico (nem durante a janela das chaves de teste da Stripe). A raiz do
# dominio e a landing (outro site); por isso rota com caminho, e nao custom
# domain, que tomaria o hostname inteiro.
workers_dev = false

routes = [
  { pattern = "falow.app.br/sistema", zone_name = "falow.app.br" },
  { pattern = "falow.app.br/sistema/*", zone_name = "falow.app.br" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Crons: a cada minuto roda as sequencias; as 06:00 UTC roda o purge.
# O scheduled() esta em worker.ts.
[triggers]
crons = ["* * * * *", "0 6 * * *"]

# Workers Logs ligado pelo arquivo (um deploy nao desliga). E onde aparecem
# avisos que so existem no log, como "[stripe] compra repetida ignorada".
[observability]
enabled = true
